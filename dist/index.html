<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where JobsOhio's grant money went | Data 4 The People</title>
<meta name="description" content="Every grant JobsOhio has disclosed on its IRS Form 990 since 2014, classified by the size and home state of the company that received it. Small businesses are most of the recipients; large companies get most of the dollars.">
<style>
  html,body{margin:0;padding:0}
  .jo{
    container-type:inline-size;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --line:#e1e0d9; --border:rgba(11,11,11,.10); --hover:#efeee9; --focus:#2a78d6;
    --small:#2a78d6; --large:#eb6834; --unk:#b9b7ae; --ohio:#008300; --other:#4a3aa7;
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.45;
    padding:20px 20px 16px; box-sizing:border-box; -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){
    .jo:not(.framed){
      --page:#181A1B; --surface:#1f2223; --ink:#E4E2DC; --ink2:#BBBDC0; --muted:#8C9094;
      --line:#33373A; --border:rgba(255,255,255,.10); --hover:#24282a; --focus:#6da7ec;
      --small:#3987e5; --large:#d95926; --unk:#6b6e70; --ohio:#2fa32f; --other:#9085e9;
    }
    .jo:not(.framed) .brand img.logo-on-light{display:none} .jo:not(.framed) .brand img.logo-on-dark{display:block}
  }
  .jo *{box-sizing:border-box}
  .jo .wrap{max-width:1180px;margin:0 auto}
  .jo h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;font-size:28px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
  .jo .sub{color:var(--ink2);font-size:15px;margin:0 0 12px;max-width:82ch}
  .jo .ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 12px}
  .jo .ctl .lab{font-size:13px;color:var(--ink2);margin-right:6px}
  .jo .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);vertical-align:middle}
  .jo .seg button{appearance:none;border:0;border-left:1px solid var(--border);background:transparent;color:var(--ink2);
                  font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;padding:8px 12px;cursor:pointer}
  .jo .seg button:first-child{border-left:0}
  .jo .seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
  .jo button:focus-visible,.jo input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .jo .card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .jo .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .jo .tile{padding:14px 16px}
  .jo .tile .lab{font-size:13.5px;color:var(--ink2)}
  .jo .tile .val{font-size:40px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
  .jo .tile .hint{font-size:12.5px;color:var(--muted)}
  .jo .grid2{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
  @container (min-width: 880px){ .jo .grid2{grid-template-columns:1fr 1fr} }
  .jo .chart{padding:12px 14px 10px}
  .jo .chart h2{font-size:15px;font-weight:650;margin:0 0 2px}
  .jo .chart .note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .jo .legend{font-size:12.5px;color:var(--ink2);margin:6px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px}
  .jo .legend b{font-weight:650}
  .jo svg{display:block;width:100%;height:auto;overflow:visible}
  .jo .bar-lab{font-size:12px;fill:var(--ink2)}
  .jo .seg-lab{font-size:12px;font-weight:650;fill:#fff}
  .jo .seg-lab.dark{fill:var(--ink)}
  .jo .axis{font-size:11px;fill:var(--muted)}
  .jo .gl{stroke:var(--line);stroke-width:1}
  .jo .two{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:13px;align-items:stretch}
  .jo .two .hd{color:var(--muted);font-size:12px;align-self:end;text-align:center}
  .jo .two .rh{color:var(--muted);font-size:12px;align-self:center;text-align:right;padding-right:4px}
  .jo .two .cell{border-radius:8px;padding:8px 10px;border:1px solid var(--border);border-left-width:5px}
  .jo .two .cell .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
  .jo .two .cell .s{font-size:12px;color:var(--muted)}
  .jo .wc{font-size:13px;color:var(--ink2);margin:10px 0 0}
  .jo .tablecard{padding:10px 12px 12px;margin-bottom:12px}
  .jo .tablectl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .jo input[type=search]{font:14px system-ui,sans-serif;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--page);color:var(--ink);min-width:240px;flex:1}
  .jo .count{font-size:12.5px;color:var(--muted)}
  .jo .tablewrap{overflow:auto;max-height:560px}
  .jo table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  .jo th,.jo td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  .jo th{position:sticky;top:0;background:var(--surface);z-index:1}
  .jo td.num,.jo th.num{text-align:right}
  .jo th button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 12px system-ui,sans-serif;cursor:pointer;padding:0}
  .jo th button[aria-sort]::after{content:" ▾"} .jo th button[aria-sort="ascending"]::after{content:" ▴"}
  .jo tbody tr:hover{background:var(--hover)}
  .jo td .key{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:baseline}
  .jo td .conf{display:inline-block;font-size:11px;font-weight:650;padding:0 5px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
  .jo td a{color:var(--ink2)}
  .jo .more{margin-top:8px;font-size:13px}
  .jo .more button{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink2);border-radius:8px;padding:6px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
  .jo .foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted)}
  .jo .foot .src{max-width:95ch}
  .jo .brand{display:block;flex:none}
  .jo .brand img{height:22px;display:block}
  .jo .brand img.logo-on-dark{display:none}
  .jo #tip{position:fixed;z-index:10;pointer-events:none;display:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);
           border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.14);max-width:300px}
  .jo #tip .v{font-weight:650;font-size:16px;font-variant-numeric:tabular-nums}
  .jo #tip .s{color:var(--muted);font-size:12px}
  /* frame variant: fixed 780 px, light theme pinned, content scrolls inside */
  .jo.framed{height:780px;overflow:hidden;padding:12px 14px 10px}
  .jo.framed .wrap{height:100%;display:flex;flex-direction:column}
  .jo.framed h1{font-size:21px;margin-bottom:3px}
  .jo.framed .sub{font-size:13.5px;margin-bottom:8px}
  .jo.framed .body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
  .jo.framed .tile .val{font-size:30px}
  .jo.framed .tablewrap{max-height:420px}
  .jo.framed .foot{margin-top:8px} .jo.framed .foot .src{font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  @container (max-width: 640px){
    .jo h1{font-size:22px} .jo .tiles{grid-template-columns:1fr} .jo .tile .val{font-size:32px}
    .jo .seg button{padding:7px 9px;font-size:12px} .jo .two .cell .v{font-size:16px}
  }
  .jo [hidden]{display:none!important}
</style>
</head>

  if (state.denom === "business"){ var biz = {}; D.parents_table.forEach(function(p){ if (p.class === "business") biz[p.parent] = 1; }); rows = rows.filter(function(r){ return biz[r.parent]; }); }
  if (q) rows = rows.filter(function(r){ return (r.recipient + " " + r.city + " " + r.parent).toLowerCase().indexOf(q) >= 0; });
  return rows;
}
function renderTable(){
  var cols = state.tview === "parents" ? PCOLS : RCOLS;
  var head = document.querySelector("#tbl thead tr"), body = document.querySelector("#tbl tbody"); head.replaceChildren(); body.replaceChildren();
  cols.forEach(function(c){
    var th = el("th",{scope:"col", class: c[2] ? "num" : ""},head), b = el("button",{type:"button"},th); b.textContent = c[1];
    if (state.sortKey === c[0]) b.setAttribute("aria-sort", state.sortDir > 0 ? "ascending" : "descending");
    b.addEventListener("click", function(){ state.sortDir = state.sortKey === c[0] ? -state.sortDir : (c[2] ? -1 : 1); state.sortKey = c[0]; state.limit = 100; renderTable(); });
  });
  var rows = tableRows().slice().sort(function(a,b){ var x = a[state.sortKey], y = b[state.sortKey]; if (Array.isArray(x)) { x = x[0]||0; y = y[0]||0; } return (x < y ? -1 : x > y ? 1 : 0) * state.sortDir; });
  document.getElementById("count").textContent = rows.length.toLocaleString() + (state.tview === "parents" ? " companies" : " payments") + (state.q ? " match" : "");
  rows.slice(0, state.limit).forEach(function(p){
    var tr = el("tr",{},body);
    if (state.tview === "parents"){
      var td = el("td",{},tr), key = el("span",{class:"key"},td); key.style.background = SIZE_COLORS[sizeGroup(p)];
      if (p.sources && p.sources.length){ var a = el("a",{href:p.sources[0], target:"_blank", rel:"noopener"},td); a.textContent = p.parent; } else td.appendChild(document.createTextNode(p.parent));
      txt("td","",CLASS_LABEL[p.class] || p.class,tr); txt("td","",p.bucket || "unresolved",tr); txt("td","",p.hq || "",tr);
      var tc = el("td",{},tr); if (p.conf){ var s = el("span",{class:"conf", title:{A:"SEC or IRS filing",B:"JobsOhio, partner release or Form 5500",C:"Website or directory",D:"Unresolved"}[p.conf]||""},tc); s.textContent = p.conf; }
      txt("td","num",moneyFull(p.cash),tr); txt("td","num",String(p.recipients),tr); txt("td","",p.years.length > 1 ? p.years[0] + " to " + p.years[p.years.length-1] : String(p.years[0]),tr);
    } else {
      txt("td","num",String(p.fy),tr); txt("td","",p.recipient,tr); txt("td","",p.city,tr); txt("td","",p.state,tr); txt("td","",p.parent,tr); txt("td","num",moneyFull(p.cash),tr);
    }
  });
  var more = document.getElementById("more"); more.replaceChildren();
  if (rows.length > state.limit){ var b = el("button",{type:"button"},more); b.textContent = "Show " + Math.min(500, rows.length - state.limit) + " more of " + rows.length.toLocaleString(); b.addEventListener("click", function(){ state.limit += 500; renderTable(); }); }
}

/* ---- controls ---- */
function seg(id, key, after){
  var box = document.getElementById(id);
  Array.prototype.forEach.call(box.children, function(b){
    b.addEventListener("click", function(){ state[key] = b.getAttribute("data-v"); Array.prototype.forEach.call(box.children, function(c){ c.setAttribute("aria-pressed", String(c === b)); }); after(); });
  });
}

seg("denom","denom",renderAll); seg("cutoff","cutoff",renderAll);
